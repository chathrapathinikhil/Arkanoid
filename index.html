<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arkanoid - Break Your Commits</title>
    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      canvas {
        background: #000;
        box-shadow: 0 0 20px #0f0;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const ROWS = 7;
      const COLS = 53;
      const BRICK_WIDTH = canvas.width / COLS;
      const BRICK_HEIGHT = 20;

      let paddle = {
        width: 100,
        height: 12,
        x: canvas.width / 2 - 50,
        y: canvas.height - 20,
        speed: 7,
        dx: 0,
      };

      function drawPaddle() {
        ctx.fillStyle = "#00ffff";
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      }

      function movePaddle() {
        paddle.x += paddle.dx;
        if (paddle.x < 0) paddle.x = 0;
        if (paddle.x + paddle.width > canvas.width)
          paddle.x = canvas.width - paddle.width;
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") paddle.dx = paddle.speed;
        if (e.key === "ArrowLeft") paddle.dx = -paddle.speed;
      });
      document.addEventListener("keyup", (e) => {
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") paddle.dx = 0;
      });

      async function fetchBricksFromServer() {
        try {
          const response = await fetch("/.netlify/functions/getCommits");
          const data = await response.json();
          const weeks =
            data.data.user.contributionsCollection.contributionCalendar.weeks;

          const brickData = [];
          for (let r = 0; r < 7; r++) {
            for (let c = 0; c < weeks.length; c++) {
              const day = weeks[c].contributionDays[r];
              brickData.push({
                x: c * BRICK_WIDTH,
                y: r * BRICK_HEIGHT,
                active: day.contributionCount > 0,
                count: day.contributionCount,
              });
            }
          }
          return brickData;
        } catch (err) {
          console.error("Using fallback bricks due to error:", err);
          return generateFallbackBricks();
        }
      }

      let bricks = [];

      let ball = {
        x: canvas.width / 2,
        y: canvas.height - 30,
        dx: 2,
        dy: -2,
        radius: 8,
      };

      function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#32de84";
        ctx.fill();
        ctx.closePath();
      }

      function drawBricks() {
        for (let brick of bricks) {
          if (brick.active) {
            let green = Math.min(255, 50 + brick.count * 10);
            ctx.fillStyle = `rgb(50, ${green}, 50)`;
            ctx.fillRect(brick.x, brick.y, BRICK_WIDTH - 2, BRICK_HEIGHT - 2);
          }
        }
      }

      function collisionDetection() {
        for (let brick of bricks) {
          if (brick.active) {
            if (
              ball.x > brick.x &&
              ball.x < brick.x + BRICK_WIDTH &&
              ball.y > brick.y &&
              ball.y < brick.y + BRICK_HEIGHT
            ) {
              ball.dy = -ball.dy;
              brick.active = false;
              break;
            }
          }
        }

        // Paddle collision
        if (
          ball.x > paddle.x &&
          ball.x < paddle.x + paddle.width &&
          ball.y + ball.radius > paddle.y &&
          ball.y - ball.radius < paddle.y + paddle.height
        ) {
          ball.dy = -ball.dy;
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawBall();
        drawPaddle();
        movePaddle();
        collisionDetection();

        if (
          ball.x + ball.dx > canvas.width - ball.radius ||
          ball.x + ball.dx < ball.radius
        ) {
          ball.dx = -ball.dx;
        }
        if (ball.y + ball.dy < ball.radius) {
          ball.dy = -ball.dy;
        }

        ball.x += ball.dx;
        ball.y += ball.dy;

        requestAnimationFrame(draw);
      }

      bricks = fetchBricksFromServer().then((data) => {
        bricks = data;
        draw();
      });
      draw();
    </script>
  </body>
</html>
